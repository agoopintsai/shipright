<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shipright Concept</title>
<style>
:root {
  --bg: #fafaf7; --fg: #1f2328; --muted: #5d6570; --line: #b9bec6; --card: #ffffff;
  --human: #dbe8fb; --human-s: #3b6fc4;
  --judge: #e6dcf7; --judge-s: #7a52c2;
  --hands: #d5efe8; --hands-s: #2a8a73;
  --brain: #fbebc8; --brain-s: #b07a12;
  --chip: #d9dce1; --chip-t: #3d434b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b; --fg: #e6e8eb; --muted: #98a1ac; --line: #4a525c; --card: #1c2025;
    --human: #1f3354; --human-s: #7fa8ea;
    --judge: #34285a; --judge-s: #b497ee;
    --hands: #174238; --hands-s: #5cc3a8;
    --brain: #4a3810; --brain-s: #e3b44f;
    --chip: #3a4048; --chip-t: #d3d7dc;
  }
}
:root[data-theme="dark"] {
  --bg: #14171b; --fg: #e6e8eb; --muted: #98a1ac; --line: #4a525c; --card: #1c2025;
  --human: #1f3354; --human-s: #7fa8ea;
  --judge: #34285a; --judge-s: #b497ee;
  --hands: #174238; --hands-s: #5cc3a8;
  --brain: #4a3810; --brain-s: #e3b44f;
  --chip: #3a4048; --chip-t: #d3d7dc;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 1.8rem; margin: 0 0 4px; }
.tag { color: var(--muted); margin: 0 0 32px; }
figure { margin: 0 0 40px; }
figcaption { font-weight: 600; margin-bottom: 8px; }
figcaption span { color: var(--muted); font-weight: 400; }
svg { width: 100%; height: auto; display: block; }
svg text { fill: var(--fg); font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
svg .s { font-size: 11px; fill: var(--muted); }
svg .b { font-weight: 700; font-size: 15px; }
svg .c { text-anchor: middle; }
.human { fill: var(--human); stroke: var(--human-s); }
.judge { fill: var(--judge); stroke: var(--judge-s); }
.hands { fill: var(--hands); stroke: var(--hands-s); }
.brain { fill: var(--brain); stroke: var(--brain-s); }
.card { fill: var(--card); stroke: var(--line); }
.chip { fill: var(--chip); stroke: none; }
svg .chipt { font-size: 10.5px; font-weight: 600; fill: var(--chip-t); text-anchor: middle; }
.link { stroke: var(--muted); stroke-width: 1.6; fill: none; }
.tools { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 6 5; }
svg rect, svg polygon { stroke-width: 1.5; }
.note { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
<h1>Shipright</h1>
<p class="tag">Ship it right, keep shipping. AI drafts, humans sign, tools can only say no.</p>

<figure>
<figcaption>Figure 1. Three layers, one spine <span>(who does what, and what each layer reads and writes)</span></figcaption>
<svg viewBox="0 0 760 450" role="img" aria-label="A pyramid of three layers (human, AI judge, AI hands and triage) connected to a brain column, all inside a dashed outline for tools">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--muted)"/>
    </marker>
  </defs>
  <rect class="tools" x="2" y="2" width="756" height="446" rx="12"/>
  <text class="s" x="20" y="437">Tools: hooks, gates, CI, lint. They can only say no.</text>

  <polygon class="human" points="240,20 304,130 176,130"/>
  <text class="b c" x="240" y="92">Human</text>
  <text class="s c" x="240" y="110">decide</text>

  <polygon class="judge" points="176,130 304,130 385,270 95,270"/>
  <text class="b c" x="240" y="186">AI judge</text>
  <text class="s c" x="240" y="204">manage</text>
  <text class="s c" x="240" y="224">grill, write spec, delegate</text>

  <polygon class="hands" points="95,270 385,270 460,400 20,400"/>
  <text class="b c" x="240" y="322">AI hands + triage</text>
  <text class="s c" x="240" y="340">execute</text>
  <text class="s c" x="240" y="360">read, search, write, test</text>

  <line class="link" x1="298" y1="75" x2="556" y2="75" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="s c" x="428" y="66">writes the why, reads direction</text>
  <line class="link" x1="372" y1="205" x2="556" y2="205" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="s c" x="464" y="196">reads banks, writes spec</text>
  <line class="link" x1="446" y1="340" x2="556" y2="340" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="s c" x="501" y="331">reads map, logs progress</text>

  <text class="b c" x="650" y="14" style="font-size:12px">Brain repo</text>
  <rect class="brain" x="560" y="20" width="180" height="110" rx="8"/>
  <text class="b c" x="650" y="68" style="font-size:13px">Decisions and why</text>
  <text class="s c" x="650" y="88">human-signed</text>
  <rect class="brain" x="560" y="145" width="180" height="120" rx="8"/>
  <text class="b c" x="650" y="196" style="font-size:13px">Templates and banks</text>
  <text class="s c" x="650" y="216">spec templates, question banks</text>
  <rect class="brain" x="560" y="280" width="180" height="120" rx="8"/>
  <text class="b c" x="650" y="326" style="font-size:13px">Progress and solved</text>
  <text class="s c" x="650" y="346">append-only log</text>
</svg>
</figure>

<figure>
<figcaption>Figure 2. Mechanism <span>(one change, from request to shipped; grey chips mark where tools bite)</span></figcaption>
<svg viewBox="0 0 760 520" role="img" aria-label="Four bands: human, GitHub product repo, AI, brain repo, with grey chips for gate, CI, hook and lint">
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="var(--muted)"/>
    </marker>
  </defs>

  <rect class="human" x="10" y="10" width="740" height="104" rx="10"/>
  <text class="b" x="26" y="34">Human</text>
  <rect class="card" x="40" y="52" width="200" height="44" rx="22"/>
  <text class="c" x="140" y="79">say what you want</text>
  <rect class="card" x="280" y="52" width="200" height="44" rx="22"/>
  <text class="c" x="380" y="79">approve spec, approve code</text>
  <rect class="card" x="520" y="52" width="200" height="44" rx="22"/>
  <text class="c" x="620" y="79">write the why</text>

  <rect class="card" x="10" y="134" width="740" height="104" rx="10"/>
  <text class="b" x="26" y="158">GitHub product repo</text>
  <text class="s" x="200" y="158">one PR, two reviews</text>
  <rect class="judge" x="40" y="172" width="190" height="50" rx="8"/>
  <text class="c" x="135" y="194">1. spec review</text>
  <text class="s c" x="135" y="211">human approves the spec</text>
  <rect class="judge" x="290" y="172" width="190" height="50" rx="8"/>
  <text class="c" x="385" y="194">2. code review</text>
  <text class="s c" x="385" y="211">human approves the code</text>
  <rect class="hands" x="540" y="172" width="180" height="50" rx="8"/>
  <text class="c" x="630" y="194">3. ship</text>
  <text class="s c" x="630" y="211">human presses the button</text>
  <line class="link" x1="230" y1="197" x2="288" y2="197" marker-end="url(#d)"/>
  <line class="link" x1="480" y1="197" x2="538" y2="197" marker-end="url(#d)"/>
  <rect class="chip" x="600" y="142" width="48" height="18" rx="9"/><text class="chipt" x="624" y="155">gate</text>
  <rect class="chip" x="656" y="142" width="40" height="18" rx="9"/><text class="chipt" x="676" y="155">CI</text>

  <rect class="hands" x="10" y="258" width="740" height="104" rx="10"/>
  <text class="b" x="26" y="282">AI</text>
  <text class="s" x="60" y="282">judge decides, hands execute</text>
  <rect class="card" x="40" y="298" width="200" height="50" rx="8"/>
  <text class="c" x="140" y="318">triage picks up</text>
  <text class="s c" x="140" y="336">the problem</text>
  <rect class="card" x="290" y="298" width="170" height="50" rx="8"/>
  <text class="c" x="375" y="318">asks the brain</text>
  <text class="s c" x="375" y="336">decisions, map, log</text>
  <rect class="card" x="510" y="298" width="210" height="50" rx="8"/>
  <text class="c" x="615" y="318">solves or escalates</text>
  <text class="s c" x="615" y="336">escalates to the human</text>
  <line class="link" x1="240" y1="323" x2="288" y2="323" marker-end="url(#d)"/>
  <line class="link" x1="460" y1="323" x2="508" y2="323" marker-end="url(#d)"/>
  <rect class="chip" x="690" y="266" width="44" height="18" rx="9"/><text class="chipt" x="712" y="279">hook</text>

  <rect class="brain" x="10" y="382" width="740" height="104" rx="10"/>
  <text class="b" x="26" y="406">Brain repo</text>
  <rect class="card" x="40" y="420" width="320" height="50" rx="8"/>
  <text class="c" x="200" y="440">progress log</text>
  <text class="s c" x="200" y="458">written by AI, append-only</text>
  <rect class="card" x="400" y="420" width="320" height="50" rx="8"/>
  <text class="c" x="560" y="440">decisions and why</text>
  <text class="s c" x="560" y="458">human-signed</text>
  <rect class="chip" x="690" y="390" width="40" height="18" rx="9"/><text class="chipt" x="710" y="403">lint</text>

  <line class="link" x1="380" y1="114" x2="380" y2="132" marker-end="url(#d)"/>
  <line class="link" x1="380" y1="238" x2="380" y2="256" marker-end="url(#d)"/>
  <line class="link" x1="380" y1="362" x2="380" y2="380" marker-end="url(#d)"/>

  <rect class="chip" x="10" y="498" width="44" height="16" rx="8"/>
  <text class="s" x="62" y="510">Grey chips: where tools bite. Gate: red-zone edits. CI: checks on the PR. Hook: tool calls. Lint: brain format.</text>
</svg>
</figure>

<p class="note">See the <a href="../README.md">README</a> and the <a href="DESIGN.md">design contract</a>.</p>
</main>
</body>
</html>
